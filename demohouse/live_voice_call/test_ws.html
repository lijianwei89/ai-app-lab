<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
</head>
<body>
    <h1>WebSocket连接测试</h1>
    <button onclick="testConnection()">测试连接</button>
    <div id="status"></div>
    <div id="messages"></div>

    <script>
        function testConnection() {
            const status = document.getElementById('status');
            const messages = document.getElementById('messages');
            
            status.innerHTML = '正在连接...';
            
            try {
                const ws = new WebSocket('ws://localhost:8889');
                
                ws.onopen = function(event) {
                    status.innerHTML = '<span style="color: green;">✅ 连接成功</span>';
                    messages.innerHTML += '<div>连接已建立</div>';
                    
                    // 发送测试消息
                    ws.send(JSON.stringify({
                        event: 'UserParameters',
                        payload: {
                            question: '测试问题',
                            answer: '测试答案',
                            user_responds: '测试语音',
                            question_stem: '测试题干',
                            student_name: '测试学生',
                            question_category: '测试分类'
                        }
                    }));
                };
                
                ws.onmessage = function(event) {
                    const data = JSON.parse(event.data);
                    messages.innerHTML += `<div>收到: ${data.event}</div>`;
                };
                
                ws.onerror = function(error) {
                    status.innerHTML = '<span style="color: red;">❌ 连接错误</span>';
                    messages.innerHTML += `<div>错误: ${error}</div>`;
                };
                
                ws.onclose = function(event) {
                    status.innerHTML = '<span style="color: orange;">连接关闭</span>';
                    messages.innerHTML += '<div>连接已关闭</div>';
                };
                
            } catch (error) {
                status.innerHTML = `<span style="color: red;">❌ 连接失败: ${error}</span>`;
            }
        }
    </script>
</body>
</html>
